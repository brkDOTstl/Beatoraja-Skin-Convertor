[workspace]
members = [
    "apps/skin_generator_ui/src-tauri",
    "crates/skin_cli",
    "crates/skin_core",
    "crates/skin_rules",
]
resolver = "2"

[workspace.package]
authors = ["IIDX"]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0", features = [] }
tauri-build = "2.0"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
